<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hoy's Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    /* Loading screen */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      display: flex;
      flex-direction: column;
      align-items: center;      /* horizontal centering */
      justify-content: center;  /* vertical centering */
      z-index: 10001;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    /* Video fills most of the screen without cropping */
    #loading-video {
      width: 80%;
      max-height: 80%;
      height: auto;             /* preserve aspect */
      object-fit: contain;      /* letterbox, no crop */
      transform: scale(1.3);
    }
    /* Button 100px below the video, white styling */
    #enter-button {
  position: fixed;
  top: 60vh;                   /* ¾ down the viewport */
  left: 50%;
  transform: translateX(-50%);
  background: #39FF14;     /* no fill */
  border: 2px solid #39FF14;   /* green outline */
  color: #000;              /* green text */
  padding: 0.75rem 1.5rem;
  font-size: 1rem;
  font-family: 'Special Elite', cursive;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease;
  z-index: 10002;              /* above the loader/video */
}

#enter-button:hover {
  border: 2px solid #000; 
  background: #000;         /* fill green on hover */
  color: #39FF14;                 /* text turns black on hover */
}

    /* Fade-out class */
    #loading-screen.loaded {
      opacity: 0;
    }

    /* Rest of your styles… */
    body {
      margin: 0;
      font-family: 'Special Elite', cursive;
    }
    .project_title {
      font-size: 40px;
      color: #FFFFFF;
      width: 333px;
      height: 170px;
      position: fixed;
      top: 12%;
      left: 20%;
      transform: rotate(3deg);
      z-index: 1;
    }
    .clickable-square {
  position: fixed;               /* ← make it fixed to the viewport */
  top: 55%;                      /* adjust as needed */
  left: 50%;
  transform: translate(-50%, -50%);
  width: 400px;
  height: 250px;
  background-color: transparent;
  cursor: pointer;
  z-index: 1;
}

    #particle-overlay,
    #particle-overlay_2 {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.5;
    }
    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <!-- Particle overlays -->
  <video id="particle-overlay" src="Videos/particle.mp4" autoplay loop muted playsinline></video>
  <video id="particle-overlay_2" src="Videos/particle-1.mp4" autoplay loop muted playsinline></video>

  <!-- Loading overlay with centered video + white button -->
  <div id="loading-screen">
    <video
      id="loading-video"
      src="Videos/Introduction.mp4"
      autoplay
      loop
      muted
      playsinline
    ></video>
    <button id="enter-button">Enter My World</button>
  </div>


  <!-- Main content -->
  <div class="project_title">
    <p>Click Below</p>
    <p>---></p>
  </div>
  <a href="project.html" class="clickable-square"></a>

  <script type="module" src="main.js"></script>
  <script>
    document.getElementById('enter-button').addEventListener('click', () => {
      const loader = document.getElementById('loading-screen');
      loader.classList.add('loaded');
      setTimeout(() => loader.remove(), 600);
    });
  </script>
</body>
</html>
