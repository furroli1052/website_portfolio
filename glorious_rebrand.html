      body {

      /* Video Background */
      .video-container {

        text-align: center;
      }

      nav a:hover {

      }

      /* Dropdown Menu */
      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 10em;
        background-color: black;
        border: 1px solid black;
        z-index: 1000;
        font-size: 15px;
        text-align: left;
      }

      .dropdown:hover .dropdown-content {
        display: block;
      }

      .dropdown-content li a {
        display: block;
        padding: 0.5em 1em;
        color: #20C20E;
        white-space: nowrap;
      }

      .dropdown-content li a:hover {

        color: #fff;
