<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Hoy's Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <style>
      /* Global */
      body {
        margin: 0;
        font-family: 'Special Elite', cursive;
        background-color: #333;
        position: relative;
        z-index: 0;
      }
      p {
        margin: 0;
      }

      /* Headings */
      h2 {
        font-size: 36px;
        color: #20C20E;
      }

      /* Navigation */
      nav {
        background-color: black;
        margin-top: 30px;
      }
      nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        text-align: center;
      }
      nav li {
        display: inline-block;
        position: relative;
      }
      nav a {
        display: inline-block;
        color: #20C20E;
        padding: 14px 16px;
        text-decoration: none;
      }
      nav a:hover {
        background-color: #111;
      }
      .dropdown-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        min-width: 10em;
        background-color: black;
        border: 1px solid black;
        font-size: 15px;
        text-align: left;
        z-index: 1000;
      }
      li.dropdown:hover .dropdown-content {
        display: block;
      }
      .dropdown-content li a {
        display: block;
        padding: 0.5em 1em;
        color: #20C20E;
        white-space: nowrap;
      }
      .dropdown-content li a:hover {
        background-color: #444;
        color: #fff;
      }

      /* Layout */
      .container {
        width: 90%;
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 20px;
        position: relative;
        z-index: 1;
      }
      .project_description,
      .project_display {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: #20C20E;
      }

      .project_description::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 50%;
        height: 100%;
        transform: translateX(-120%);
        background: black;
        filter: blur(100px);
        z-index: -1;
      }

      .project-btn {
        background-color: #20C20E;
        color: #333;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 20px;
        cursor: pointer;
        transition: background-color 0.3s ease;
        margin-top: 20px;
      }
      .project-btn:hover {
        background-color: #111;
        color: #20C20E;
      }

      /* Enhanced Glowing Effect on Images */
      .project_display img {
        box-shadow: 0 0 30px #20C20E, 0 0 60px #20C20E;
        border-radius: 10px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
      }

      /* Video Background */
      .video-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }
      .video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- Video Background -->
    <div class="video-container">
      <video autoplay muted loop>
        <source src="Videos/hacker_screen.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Navigation -->
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li class="dropdown">
          <a href="#">Projects ▾</a>
          <ul class="dropdown-content">
            <li><a href="graphic_design.html">Graphic Design</a></li>
            <li><a href="rebrand.html">Rebrand</a></li>
            <li><a href="website_design.html">Web Design</a></li>
            <li><a href="ux_design.html">UX Design</a></li>
            <li><a href="photography.html">Photography</a></li>
            <li><a href="video_editing.html">Video Editing</a></li>
          </ul>
        </li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- Projects Section -->
    <div class="container">
      <div class="project_description">
        <h2>Portfolio Site</h2>
        <p>Website showcasing how</p>
        <p>stylistic and vibrant my design style is</p>
        <a href="portfolio_site.html">
          <button class="project-btn">My Process</button>
        </a>
      </div>
      <div class="project_display" style="gap: 10px; flex-wrap: nowrap; align-items: flex-start; display: flex;">
        <div style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
          <img src="Photos/website_portfolio/portfolio_1.png" alt="Project Image 1" style="width: 25%; height: auto; transform: translateX(100px);">
          <img src="Photos/website_portfolio/portfolio_2.png" alt="Project Image 2" style="width: 50%; height: auto; transform: translateX(250px);">
        </div>
      </div>
    </div>
  </body>
</html>
