    <style>
      body { 
        margin: 0;
        font-family: 'Special Elite', cursive;
        background-color: #333;
        color: #fff;
      }

      h5 {
        font-size: 75px;
        color: black;
        text-align: center;
      }

      h5::before {
        content: "";
        position: absolute;
        top: 20%;
        left: 20%;
        width: 60%;
        height: 15%;
        background: #20C20E;
        filter: blur(50px);
        z-index: -1;
      }
      
        /* Navigation bar styles */
      nav {
        background-color: black;
        overflow: visible;
        margin-top: 30px;
      }

      nav ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        text-align: center;
      }

      nav li {
        display: inline-block;
      }

      nav li a {
        display: inline-block;
        color: #20C20E;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
      }

      nav li a:hover {
        background-color: #111;
      }

      nav li.dropdown {
      position: relative;
    }

    nav li .dropdown-content {
      text-align: left;
      display: none;
      position: absolute;
      top: 100%;           /* right below its parent <li> */
      left: 0;
      min-width: 10em;     /* adapt as needed */
      background: black;
      border: 1px solid black;
      z-index: 1000;       /* on top of everything */
      font-size: 15px;
    }
    nav li.dropdown:hover .dropdown-content {
      display: block;
    }
    nav li .dropdown-content li a {
      display: block;
      padding: 0.5em 1em;
      color: #20C20E;
      text-align: left;
      white-space: nowrap;
    }
    nav li .dropdown-content li a:hover {
      background: #444;
      color: #fff;
    }


      /* Video Background Styles */
      .video-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
      }

      .video-container video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .video-item {
  overflow: hidden;
}

/* 1. Two-column grid */
.gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 90%;
  max-width: 1200px;
  margin: 25px auto;
}

/* 2. Responsive 16:9 videos */
.video-item iframe {
  width: 100%;
  aspect-ratio: 16 / 9;
  /* remove fixed height */
  height: auto;
  display: block;
  border: none;
  box-shadow: 0 0 30px 10px rgba(32, 194, 14, 0.8);
  transition: box-shadow 0.3s ease;
}

.video-item iframe:hover {
  box-shadow: 0 0 60px 20px rgba(32, 194, 14, 1);
}

    </style>
